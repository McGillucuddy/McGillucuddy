<title>After Game Night</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* Layout: one lamp-lit screen. Header strip, a wooden table of scattered pieces, a shelf of open game boxes below. Single evening look on purpose. */
:root{
  --room:#2b1d27; --room-2:#382431;
  --wood:#b97a4b; --wood-dark:#8a5332; --wood-light:#d69d6b;
  --shelf:#5e3622; --shelf-light:#7a4a2f;
  --lamp:255,196,120;
  --ink:#fff1de; --ink-soft:#ecd3b8; --ink-dim:#b9998a;
  --honey:#f3b648; --honey-deep:#c98a1c;
  --paper:#fdf0dc; --paper-ink:#3b2630; --paper-dim:#8a6f6a;
  --display:"Bagel Fat One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --p:44px; --seat:22px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  background:
    radial-gradient(ellipse 70% 45% at 50% -8%, rgba(var(--lamp),.30), transparent 70%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 2px, transparent 2px 26px),
    var(--room);
  color:var(--ink); font-family:var(--body); overflow-x:hidden; overflow-y:auto;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit}
#app{
  height:100%; max-width:1120px; margin:0 auto;
  display:grid; grid-template-rows:auto minmax(230px,1fr) auto; gap:12px;
  padding-block:12px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}

/* Header */
header{display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px}
.brand{display:flex; flex-direction:column; gap:2px; min-width:0}
.brand h1{margin:0; font-family:var(--display); font-weight:400; font-size:clamp(22px,3.2vw,30px); line-height:1; color:var(--honey); letter-spacing:.5px; text-shadow:0 2px 0 #6a3d14, 0 0 22px rgba(var(--lamp),.35)}
.night{font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-dim)}
.night b{color:var(--ink-soft)}
.progress{flex:1 1 180px; min-width:0; display:flex; flex-direction:column; gap:5px}
.progress-label{font-size:13px; font-weight:700; color:var(--ink-soft); font-variant-numeric:tabular-nums}
.progress-label b{color:var(--ink); font-weight:900}
.track{height:10px; border-radius:99px; background:rgba(0,0,0,.35); box-shadow:inset 0 1px 2px rgba(0,0,0,.5); overflow:hidden}
.fill{height:100%; width:0; border-radius:99px; background:linear-gradient(90deg,var(--honey-deep),var(--honey)); box-shadow:0 0 10px rgba(var(--lamp),.6); transition:width .4s cubic-bezier(.3,1.3,.5,1)}
.tools{display:flex; gap:8px}
.tool{display:inline-flex; align-items:center; gap:6px; height:38px; padding:0 12px; border-radius:12px; border:0; cursor:pointer; background:var(--room-2); color:var(--ink-soft); font-weight:800; font-size:13px; box-shadow:0 3px 0 #1a1018, inset 0 1px 0 rgba(255,255,255,.06); transition:transform .12s, background .12s}
.tool:hover{background:#45303c; color:var(--ink)}
.tool:active{transform:translateY(2px); box-shadow:0 1px 0 #1a1018}
.tool svg{width:18px; height:18px}
.tool[aria-pressed="false"] .wave{display:none}
:focus-visible{outline:3px solid var(--honey); outline-offset:3px; border-radius:10px}

/* Table */
#table{
  position:relative; border-radius:22px; overflow:hidden; touch-action:none;
  background:
    radial-gradient(ellipse 80% 70% at 50% 0%, rgba(var(--lamp),.34), transparent 75%),
    radial-gradient(ellipse at 50% 120%, rgba(40,15,5,.45), transparent 60%),
    repeating-linear-gradient(90deg, transparent 0 calc(25% - 2px), rgba(70,35,15,.38) calc(25% - 2px) 25%),
    repeating-linear-gradient(91deg, transparent 0 17px, rgba(90,45,18,.10) 17px 18px, transparent 18px 39px, rgba(255,225,190,.07) 39px 41px),
    linear-gradient(180deg, var(--wood-light), var(--wood) 45%, var(--wood-dark));
  box-shadow: inset 0 0 0 6px rgba(80,40,18,.45), inset 0 0 0 7px rgba(255,220,180,.12), 0 18px 40px rgba(0,0,0,.5);
}
#table.empty-tip::after{content:attr(data-tip); position:absolute; left:50%; bottom:14px; transform:translateX(-50%); font-size:12px; font-weight:800; color:rgba(60,28,10,.6); letter-spacing:.06em; text-transform:uppercase; white-space:nowrap}
.mug{position:absolute; right:3.5%; top:5%; width:64px; pointer-events:none; filter:drop-shadow(0 6px 4px rgba(40,15,5,.45))}
.steam{position:absolute; left:16px; top:-26px; width:30px; height:30px}
.steam i{position:absolute; bottom:0; width:6px; height:22px; border-radius:6px; background:linear-gradient(to top, rgba(255,240,225,.45), transparent); animation:steam 3.2s ease-in-out infinite; opacity:0}
.steam i:nth-child(1){left:0}
.steam i:nth-child(2){left:11px; animation-delay:1s}
.steam i:nth-child(3){left:22px; animation-delay:2s}
@keyframes steam{0%{transform:translateY(6px) scaleX(1); opacity:0}30%{opacity:1}100%{transform:translateY(-14px) scaleX(1.8) translateX(4px); opacity:0}}

/* Pieces */
.piece{
  position:absolute; width:var(--p); height:var(--p); padding:0; border:0; background:none; cursor:grab; touch-action:none;
  transform:translate(-50%,-50%) rotate(var(--r,0deg));
  filter:drop-shadow(0 3px 1.5px rgba(40,15,5,.5));
  transition:filter .15s;
}
.piece svg{display:block; width:100%; height:100%; pointer-events:none}
.piece:hover{filter:drop-shadow(0 5px 3px rgba(40,15,5,.45)) brightness(1.07)}
.piece.selected{z-index:5; filter:drop-shadow(0 0 4px rgba(255,214,130,1)) drop-shadow(0 0 10px rgba(243,182,72,.9)) drop-shadow(0 8px 4px rgba(40,15,5,.4)); animation:bob 1.1s ease-in-out infinite}
.piece.dragging{position:fixed; z-index:50; pointer-events:none; cursor:grabbing; transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(1.15); filter:drop-shadow(0 14px 8px rgba(30,10,0,.45)); animation:none}
.piece.hint{z-index:5; animation:hint .45s ease-in-out 4}
.piece.wobble{animation:wob .4s ease-in-out}
@keyframes bob{0%,100%{transform:translate(-50%,-50%) rotate(var(--r,0deg)) translateY(0)}50%{transform:translate(-50%,-50%) rotate(var(--r,0deg)) translateY(-5px)}}
@keyframes hint{0%,100%{transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(1)}50%{transform:translate(-50%,-50%) rotate(calc(var(--r,0deg) + 10deg)) scale(1.25)}}
@keyframes wob{0%,100%{transform:translate(-50%,-50%) rotate(var(--r,0deg))}25%{transform:translate(-50%,-50%) rotate(calc(var(--r,0deg) - 14deg))}75%{transform:translate(-50%,-50%) rotate(calc(var(--r,0deg) + 14deg))}}

/* Shelf + boxes */
#shelf{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%,180px),1fr)); gap:14px;
  padding:14px 14px 18px; border-radius:18px;
  background:
    linear-gradient(180deg, rgba(0,0,0,.25), transparent 30%),
    repeating-linear-gradient(90deg, transparent 0 30px, rgba(0,0,0,.06) 30px 31px),
    linear-gradient(180deg, var(--shelf-light), var(--shelf));
  box-shadow: inset 0 2px 0 rgba(255,220,180,.10), inset 0 -8px 0 rgba(0,0,0,.25), 0 10px 24px rgba(0,0,0,.45);
}
@media (max-width:440px){ #shelf{grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; padding:10px 10px 14px} }
.box{
  position:relative; min-width:0; border-radius:12px; padding:6px 7px 8px; cursor:pointer;
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,.07) 0 6px, transparent 6px 12px),
    var(--c);
  box-shadow:0 5px 0 var(--c-dark), 0 10px 16px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.25);
  transition:transform .18s cubic-bezier(.3,1.4,.5,1);
}
.box-rim{display:flex; align-items:baseline; justify-content:space-between; gap:6px; padding:0 3px 6px; color:#fff; text-shadow:0 1px 0 rgba(0,0,0,.35)}
.box-name{font-family:var(--display); font-size:14px; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
.box-count{font-size:11px; font-weight:900; opacity:.85; font-variant-numeric:tabular-nums; flex:none}
.insert{display:flex; flex-wrap:wrap; gap:5px; padding:5px; border-radius:8px; background:var(--c-deep); box-shadow:inset 0 3px 6px rgba(0,0,0,.5)}
.slot{
  position:relative; flex:1 1 auto;
  min-width:calc(var(--cols) * var(--seat) + (var(--cols) - 1) * 3px + 10px);
  min-height:calc(var(--rows) * var(--seat) + (var(--rows) - 1) * 3px + 10px);
  display:grid; grid-template-columns:repeat(var(--cols), var(--seat)); grid-auto-rows:var(--seat); gap:3px; padding:5px;
  align-content:center; justify-content:center;
  border-radius:6px; background:rgba(0,0,0,.2);
  box-shadow:inset 0 2px 4px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.12);
  transition:box-shadow .25s;
}
.ghost{position:absolute; inset:0; margin:auto; width:min(70%,30px); height:min(70%,30px); opacity:.26; pointer-events:none; transition:opacity .2s}
.slot.has .ghost{opacity:0}
.tally{position:absolute; right:3px; bottom:1px; font-size:9px; font-weight:900; color:rgba(255,255,255,.55); font-variant-numeric:tabular-nums; pointer-events:none}
.slot.full{box-shadow:inset 0 2px 4px rgba(0,0,0,.45), 0 0 0 2px rgba(255,214,130,.85), 0 0 12px rgba(243,182,72,.55)}
.slot.full .tally{color:var(--honey)}
.slot.hint{animation:pulse .45s ease-in-out 4}
.slot .piece{position:static; width:var(--seat); height:var(--seat); transform:none; cursor:default; filter:drop-shadow(0 1px 1px rgba(0,0,0,.45))}
.box.hover{transform:translateY(-4px) scale(1.03)}
.box.hover::after{content:""; position:absolute; inset:-5px; border-radius:15px; border:2px dashed rgba(255,241,222,.75); pointer-events:none}
.box.armed{box-shadow:0 5px 0 var(--c-dark), 0 10px 16px rgba(0,0,0,.45), 0 0 0 2px rgba(255,241,222,.35)}
.box.wrong{animation:shake .38s}
.box.done{cursor:default}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px) rotate(-1.5deg)}40%{transform:translateX(5px) rotate(1deg)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
@keyframes pulse{0%,100%{background:rgba(0,0,0,.2)}50%{background:rgba(255,214,130,.5)}}

.lid{
  position:absolute; inset:-3px; border-radius:13px; pointer-events:none;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.22), transparent 65%),
    repeating-linear-gradient(135deg, rgba(255,255,255,.08) 0 6px, transparent 6px 12px),
    var(--c);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.18), inset 0 -4px 0 rgba(0,0,0,.18), 0 6px 0 var(--c-dark);
  opacity:0; transform:translateY(-46px) scale(1.08) rotate(-2deg);
  transition:transform .5s cubic-bezier(.3,1.5,.5,1), opacity .2s;
}
.lid svg{width:34px; height:34px; filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.lid-name{font-family:var(--display); color:#fff; font-size:15px; text-shadow:0 2px 0 rgba(0,0,0,.3); text-align:center; padding:0 8px}
.stamp{position:absolute; right:8px; bottom:8px; font-size:10px; font-weight:900; letter-spacing:.1em; text-transform:uppercase; color:var(--paper-ink); background:var(--honey); padding:3px 7px; border-radius:6px; transform:rotate(-6deg) scale(0); transition:transform .35s .35s cubic-bezier(.3,1.8,.5,1)}
.box.done .lid{opacity:1; transform:none}
.box.done .stamp{transform:rotate(-6deg) scale(1)}

/* Sparks */
.spark{position:fixed; width:7px; height:7px; border-radius:50%; pointer-events:none; z-index:60}
.spark.star{width:10px; height:10px; border-radius:0; clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%)}

/* Toast */
.toast{position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom, 0px)); transform:translate(-50%,20px); z-index:70; max-width:calc(100% - 32px); padding:10px 16px; border-radius:14px; background:var(--paper); color:var(--paper-ink); font-weight:800; font-size:14px; box-shadow:0 10px 30px rgba(0,0,0,.45); opacity:0; transition:opacity .3s, transform .3s; pointer-events:none; text-align:center}
.toast.show{opacity:1; transform:translate(-50%,0)}

/* Level complete */
.ov{position:fixed; inset:0; z-index:80; display:flex; align-items:center; justify-content:center; padding:20px max(16px, env(safe-area-inset-left, 0px)); background:rgba(25,12,20,.62); backdrop-filter:blur(3px)}
.card{width:min(420px,100%); max-height:100%; overflow:auto; background:var(--paper); color:var(--paper-ink); border-radius:22px; padding:24px 22px 20px; box-shadow:0 24px 60px rgba(0,0,0,.55), inset 0 -5px 0 rgba(120,80,50,.12); text-align:center; animation:rise .45s cubic-bezier(.3,1.4,.5,1)}
@keyframes rise{from{transform:translateY(30px) scale(.94); opacity:0}}
.eyebrow{margin:0; font-size:12px; font-weight:900; letter-spacing:.1em; text-transform:uppercase; color:var(--paper-dim)}
.card h2{margin:4px 0 14px; font-family:var(--display); font-weight:400; font-size:34px; line-height:1.05; color:var(--paper-ink); text-wrap:balance}
.stack{display:flex; flex-direction:column-reverse; align-items:center; gap:3px; padding:6px 0 10px; min-height:60px}
.stackbox{height:30px; border-radius:6px; display:flex; align-items:center; justify-content:center; gap:6px; color:#fff; font-family:var(--display); font-size:13px; text-shadow:0 1px 0 rgba(0,0,0,.3); box-shadow:0 3px 0 rgba(0,0,0,.25); background:repeating-linear-gradient(135deg, rgba(255,255,255,.08) 0 6px, transparent 6px 12px), var(--c); animation:drop .5s cubic-bezier(.3,1.5,.5,1) backwards}
.stackbox svg{width:16px; height:16px}
@keyframes drop{from{transform:translateY(-60px) rotate(-6deg); opacity:0}}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:6px 0 18px}
.stats div{background:rgba(120,80,50,.09); border-radius:12px; padding:8px 4px}
.stats dt{font-size:11px; font-weight:900; letter-spacing:.08em; text-transform:uppercase; color:var(--paper-dim)}
.stats dd{margin:2px 0 0; font-size:20px; font-weight:900; font-variant-numeric:tabular-nums}
.ov-actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
.btn{height:46px; padding:0 18px; border-radius:14px; border:0; cursor:pointer; font-weight:900; font-size:15px; transition:transform .12s}
.btn:active{transform:translateY(2px)}
.btn.primary{background:var(--honey); color:var(--paper-ink); box-shadow:0 4px 0 var(--honey-deep)}
.btn.quiet{background:rgba(120,80,50,.12); color:var(--paper-ink); box-shadow:0 4px 0 rgba(120,80,50,.2)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important}
}
@media (max-width:560px){
  .tool .lbl{display:none}
  .tool{padding:0 10px}
}
</style>

<div id="app">
  <header>
    <div class="brand">
      <h1>After Game Night</h1>
      <span class="night" id="night">Night <b>1</b> · Quick Round</span>
    </div>
    <div class="progress" aria-live="polite">
      <span class="progress-label" id="plabel"><b>0</b> of 0 pieces put away</span>
      <div class="track"><div class="fill" id="pfill"></div></div>
    </div>
    <div class="tools">
      <button class="tool" id="btn-hint" type="button" title="Show a hint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>
        <span class="lbl">Hint</span>
      </button>
      <button class="tool" id="btn-sound" type="button" aria-pressed="true" title="Sound">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        <span class="lbl">Sound</span>
      </button>
      <button class="tool" id="btn-restart" type="button" title="Scatter this night again">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        <span class="lbl">Restart</span>
      </button>
    </div>
  </header>

  <main id="table" aria-label="Game table with scattered pieces">
    <div class="mug" aria-hidden="true">
      <div class="steam"><i></i><i></i><i></i></div>
      <svg viewBox="0 0 64 56">
        <ellipse cx="28" cy="50" rx="26" ry="5" fill="rgba(60,25,10,.35)"/>
        <path d="M46 18h4a9 9 0 0 1 0 18h-4" fill="none" stroke="#7a3e6e" stroke-width="5"/>
        <path d="M6 10h42v28a12 12 0 0 1-12 12H18A12 12 0 0 1 6 38z" fill="#9b5289"/>
        <path d="M6 10h42v6H6z" fill="#b56aa3"/>
        <ellipse cx="27" cy="10" rx="21" ry="4" fill="#5a2a14"/>
        <ellipse cx="27" cy="10" rx="17" ry="2.6" fill="#7b4122"/>
        <path d="M18 26l4 4 4-4 4 4 4-4" fill="none" stroke="#f3b648" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </main>

  <section id="shelf" aria-label="Open game boxes"></section>
</div>

<div class="ov" id="ov" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="ov-title">
    <p class="eyebrow" id="ov-eyebrow">Night 1</p>
    <h2 id="ov-title">The table is clear</h2>
    <div class="stack" id="stack"></div>
    <dl class="stats">
      <div><dt>Pieces</dt><dd id="st-pieces">0</dd></div>
      <div><dt>Time</dt><dd id="st-time">0:00</dd></div>
      <div><dt>Mix-ups</dt><dd id="st-oops">0</dd></div>
    </dl>
    <div class="ov-actions">
      <button class="btn quiet" id="btn-again" type="button">Play this night again</button>
      <button class="btn primary" id="btn-next" type="button">Next game night</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const root = document.documentElement;
const table = $('#table'), shelf = $('#shelf');
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Data ---------- */
const GAMES = [
  {id:'harbor',  name:'Lantern Harbor',   color:'#2e8c9a', motif:'moon'},
  {id:'orchard', name:'Orchard Hollow',   color:'#c8473b', motif:'apple'},
  {id:'atlas',   name:'Starfall Atlas',   color:'#4b56b3', motif:'star'},
  {id:'crowns',  name:'Mossy Crowns',     color:'#5a8d39', motif:'crown'},
  {id:'honey',   name:'Honeycomb Hustle', color:'#d8961f', motif:'hex'},
  {id:'plum',    name:'Plum Parlor',      color:'#8c4a86', motif:'heart'},
];
const TYPES = ['meeple','pawn','die','card','coin','hex','cube','gem'];
const TYPE_LABEL = {meeple:'meeple',pawn:'pawn',die:'die',card:'card',coin:'coin',hex:'hex tile',cube:'cube',gem:'gem'};
const LEVELS = [
  {name:'Quick Round',        games:2, types:2, count:[3,3]},
  {name:'Family Night',       games:3, types:2, count:[3,4]},
  {name:'Rainy Saturday',     games:3, types:3, count:[2,4]},
  {name:'The Rematch',        games:4, types:2, count:[3,4]},
  {name:'Tournament Weekend', games:4, types:3, count:[3,4]},
];
const LATE_NAMES = ['Snow Day','Cousins Visit','Midnight Campaign','Holiday Marathon','Game Café Closing','Birthday Bash','Long Weekend','Board Game Club'];
function levelCfg(n){
  if (n <= LEVELS.length) return LEVELS[n-1];
  return {name: LATE_NAMES[(n - LEVELS.length - 1) % LATE_NAMES.length], games:4, types:3, count:[3,5]};
}

/* ---------- Helpers ---------- */
const rand = (a,b) => a + Math.random()*(b-a);
const randInt = (a,b) => Math.floor(rand(a,b+1));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function shade(hex, amt){
  const n = parseInt(hex.slice(1),16); let r=n>>16, g=n>>8&255, b=n&255;
  const t = amt<0 ? 0 : 255, p = Math.abs(amt);
  r=Math.round(r+(t-r)*p); g=Math.round(g+(t-g)*p); b=Math.round(b+(t-b)*p);
  return `rgb(${r},${g},${b})`;
}
const store = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- Art ---------- */
function starPts(cx,cy,R,r){
  let s=''; for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rr=i%2?r:R; s+=`${(cx+Math.cos(a)*rr).toFixed(2)},${(cy+Math.sin(a)*rr).toFixed(2)} `; } return s;
}
function motifShape(m, fill){
  switch(m){
    case 'moon':  return `<path fill="${fill}" d="M22.5 13.2a7 7 0 1 0 4.6 10.9A6 6 0 1 1 22.5 13.2z"/>`;
    case 'apple': return `<path fill="${fill}" d="M20 17.5c-1.6-1.2-6-1.4-6 3.6 0 3.4 2.6 6.4 4.2 6.4.8 0 1.2-.4 1.8-.4s1 .4 1.8.4c1.6 0 4.2-3 4.2-6.4 0-5-4.4-4.8-6-3.6z"/><path fill="${fill}" d="M20.2 17c.2-2 1.4-3.6 3.6-4-.2 2-1.6 3.6-3.6 4z"/>`;
    case 'star':  return `<polygon fill="${fill}" points="${starPts(20,20.6,7.6,3.3)}"/>`;
    case 'crown': return `<path fill="${fill}" d="M12.5 25.5l-.8-9.5 4.4 3.8 3.9-6.3 3.9 6.3 4.4-3.8-.8 9.5z"/>`;
    case 'hex':   return `<polygon fill="${fill}" points="20,13 26.06,16.5 26.06,23.5 20,27 13.94,23.5 13.94,16.5"/>`;
    case 'heart': return `<path fill="${fill}" d="M20 27.5s-7.5-4.6-7.5-9.6a4 4 0 0 1 7.5-2 4 4 0 0 1 7.5 2c0 5-7.5 9.6-7.5 9.6z"/>`;
  }
  return '';
}
const motifSVG = (m, fill='#fff') => `<svg viewBox="11 11 18 18" aria-hidden="true">${motifShape(m, fill)}</svg>`;
const MEEPLE = 'M20 3.5a5.5 5.5 0 0 1 3.9 9.4c4.6.9 9.9 2.4 11.4 4.2 1.2 1.5-.2 3.5-2.4 3.4-2.6-.1-5-.6-6.4-.7 1.2 4 2.8 8.4 3.8 11.6.5 1.6-.5 3.1-2.1 3.1h-3c-1 0-1.9-.6-2.3-1.5L20 27.8l-2.9 5.2c-.4.9-1.3 1.5-2.3 1.5h-3c-1.6 0-2.6-1.5-2.1-3.1 1-3.2 2.6-7.6 3.8-11.6-1.4.1-3.8.6-6.4.7-2.2.1-3.6-1.9-2.4-3.4 1.5-1.8 6.8-3.3 11.4-4.2A5.5 5.5 0 0 1 20 3.5z';
const PIPS = {1:[[20,20]],2:[[13,13],[27,27]],3:[[13,13],[20,20],[27,27]],4:[[13,13],[27,13],[13,27],[27,27]],5:[[13,13],[27,13],[20,20],[13,27],[27,27]],6:[[13,13],[27,13],[13,20],[27,20],[13,27],[27,27]]};
function pieceSVG(type, c, motif, face=5){
  const d = shade(c,-.38), l = shade(c,.35), w = 'rgba(255,255,255,.9)';
  const small = m => `<g transform="translate(20 20) scale(.72) translate(-20 -20)">${motifShape(m, w)}</g>`;
  let s = '';
  switch(type){
    case 'meeple':
      s = `<path d="${MEEPLE}" fill="${c}" stroke="${d}" stroke-width="1.5" stroke-linejoin="round"/><path d="M16.6 7.6c.8-1.5 2.1-2.2 3.4-2.3M9 18.4c2-1 4.5-1.6 6.6-2" fill="none" stroke="${l}" stroke-width="1.6" stroke-linecap="round" opacity=".85"/>`; break;
    case 'pawn':
      s = `<path d="M20 4a6 6 0 0 1 3.4 10.9c1.6.7 2.6 1.8 2.6 3.1h-2.4l2.4 10.5H14l2.4-10.5H14c0-1.3 1-2.4 2.6-3.1A6 6 0 0 1 20 4z" fill="${c}" stroke="${d}" stroke-width="1.5" stroke-linejoin="round"/><rect x="9" y="28" width="22" height="7" rx="3.5" fill="${c}" stroke="${d}" stroke-width="1.5"/><circle cx="18" cy="8.4" r="1.8" fill="${l}" opacity=".8"/>`; break;
    case 'die':
      s = `<rect x="5" y="5" width="30" height="30" rx="7" fill="${c}" stroke="${d}" stroke-width="1.5"/><rect x="7.5" y="7.5" width="25" height="25" rx="5" fill="none" stroke="${l}" stroke-width="1" opacity=".55"/>` + PIPS[face].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2.7" fill="${w}"/>`).join(''); break;
    case 'card':
      s = `<rect x="8.5" y="3.5" width="23" height="33" rx="4" fill="${c}" stroke="${d}" stroke-width="1.5"/><rect x="11.5" y="6.5" width="17" height="27" rx="2.5" fill="none" stroke="${l}" stroke-width="1.2" opacity=".8"/>${small(motif)}`; break;
    case 'coin':
      s = `<circle cx="20" cy="20" r="15" fill="${c}" stroke="${d}" stroke-width="1.5"/><circle cx="20" cy="20" r="11.2" fill="none" stroke="${l}" stroke-width="1.4" stroke-dasharray="2 2" opacity=".85"/>${small(motif)}`; break;
    case 'hex':
      s = `<polygon points="20,4 33.9,12 33.9,28 20,36 6.1,28 6.1,12" fill="${c}" stroke="${d}" stroke-width="1.5" stroke-linejoin="round"/><polygon points="20,9 29.5,14.5 29.5,25.5 20,31 10.5,25.5 10.5,14.5" fill="none" stroke="${l}" stroke-width="1.2" opacity=".75"/>`; break;
    case 'cube':
      s = `<polygon points="20,5.5 33.5,12.5 20,19.5 6.5,12.5" fill="${l}" stroke="${d}" stroke-width="1.3" stroke-linejoin="round"/><polygon points="6.5,12.5 20,19.5 20,35 6.5,28" fill="${c}" stroke="${d}" stroke-width="1.3" stroke-linejoin="round"/><polygon points="20,19.5 33.5,12.5 33.5,28 20,35" fill="${shade(c,-.2)}" stroke="${d}" stroke-width="1.3" stroke-linejoin="round"/>`; break;
    case 'gem':
      s = `<polygon points="12,8 28,8 35,16 20,35 5,16" fill="${c}" stroke="${d}" stroke-width="1.4" stroke-linejoin="round"/><polygon points="12,8 28,8 35,16 5,16" fill="${l}" opacity=".7"/><path d="M5 16h30M14 16l6 19 6-19M12 8l2 8 6-8 6 8 2-8" fill="none" stroke="${d}" stroke-width="1" stroke-linejoin="round" opacity=".55"/>`; break;
  }
  return `<svg viewBox="0 0 40 40" aria-hidden="true">${s}</svg>`;
}

/* ---------- Sound ---------- */
let AC = null, noiseBuf = null, soundOn = store.get('agn-sound', true);
function ac(){
  if (!soundOn) return null;
  try{
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  }catch(e){ return null; }
  return AC;
}
function tone(freq, {type='triangle', dur=.14, vol=.14, delay=0, slide=0}={}){
  const c = ac(); if (!c) return;
  const t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(freq*slide, t+dur);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+.01); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.03);
}
function knock(vol=.25, freq=900, delay=0){
  const c = ac(); if (!c) return;
  if (!noiseBuf){ noiseBuf = c.createBuffer(1, c.sampleRate*.08, c.sampleRate); const ch = noiseBuf.getChannelData(0); for (let i=0;i<ch.length;i++) ch[i] = (Math.random()*2-1) * Math.pow(1-i/ch.length, 3); }
  const t = c.currentTime + delay, src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  src.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 4; g.gain.value = vol;
  src.connect(f).connect(g).connect(c.destination); src.start(t);
  tone(freq*.32, {type:'sine', dur:.07, vol:vol*.5, delay});
}
const SCALE = [523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.51,1567.98];
const sfx = {
  pick(){ knock(.10, 1500); },
  table(){ knock(.14, 1000); },
  place(n){ knock(.24, 750); tone(SCALE[Math.min(n, SCALE.length-1)], {dur:.28, vol:.10}); },
  full(){ tone(1046.5,{dur:.2,vol:.08,delay:.06}); tone(1318.5,{dur:.3,vol:.08,delay:.14}); },
  box(){ knock(.4, 260); [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,{dur:.35,vol:.09,delay:.12+i*.08})); },
  wrong(){ tone(196,{type:'sine',dur:.2,vol:.16,slide:.7}); knock(.1, 400); },
  win(){ [392,523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>tone(f,{dur:.5,vol:.08,delay:i*.09})); },
};

/* ---------- State ---------- */
const state = { level: store.get('agn-level', 1), pieces: [], boxes: [], placed: 0, total: 0, oops: 0, combo: 0, t0: 0, sel: null, p: 44 };
let drag = null;

function buildLevel(){
  const cfg = levelCfg(state.level);
  table.querySelectorAll('.piece').forEach(e => e.remove());
  document.querySelectorAll('body > .piece').forEach(e => e.remove());
  shelf.innerHTML = '';
  state.pieces = []; state.boxes = []; state.placed = 0; state.oops = 0; state.combo = 0; state.sel = null; drag = null;
  $('#ov').hidden = true;

  shuffle(GAMES).slice(0, cfg.games).forEach(game => {
    const specs = shuffle(TYPES).slice(0, cfg.types).map(type => ({type, cap: randInt(cfg.count[0], cfg.count[1])}));
    const box = makeBox(game, specs);
    state.boxes.push(box);
    specs.forEach(sp => { for (let i=0;i<sp.cap;i++) state.pieces.push(makePiece(game, sp.type)); });
  });
  // order boxes on the shelf randomly so position isn't a clue
  state.total = state.pieces.length;
  state.pieces = shuffle(state.pieces);
  state.pieces.forEach((p,i) => { p.el.dataset.idx = i; table.append(p.el); });

  $('#night').innerHTML = `Night <b>${state.level}</b> · ${cfg.name}`;
  sizePieces(); scatter(); updateProgress();
  state.t0 = performance.now();
  store.set('agn-level', state.level);
}

function makeBox(game, specs){
  const el = document.createElement('div');
  el.className = 'box'; el.tabIndex = 0; el.setAttribute('role','button');
  el.style.setProperty('--c', game.color);
  el.style.setProperty('--c-dark', shade(game.color,-.42));
  el.style.setProperty('--c-deep', shade(game.color,-.58));
  const total = specs.reduce((a,s)=>a+s.cap,0);
  el.innerHTML = `<div class="box-rim"><span class="box-name">${game.name}</span><span class="box-count">0/${total}</span></div><div class="insert"></div><div class="lid">${motifSVG(game.motif)}<span class="lid-name">${game.name}</span><span class="stamp">Put away</span></div>`;
  const insert = el.querySelector('.insert');
  const box = {el, game, total, filled:0, done:false, slots:[], countEl: el.querySelector('.box-count')};
  specs.forEach(sp => {
    const cols = Math.min(sp.cap, 3), rows = Math.ceil(sp.cap/cols);
    const s = document.createElement('div');
    s.className = 'slot'; s.style.setProperty('--cols', cols); s.style.setProperty('--rows', rows);
    s.innerHTML = `<span class="ghost">${pieceSVG(sp.type, '#f6e6d4', game.motif, 3)}</span><span class="tally">0/${sp.cap}</span>`;
    insert.append(s);
    box.slots.push({el:s, type:sp.type, cap:sp.cap, filled:0, tally:s.querySelector('.tally')});
  });
  el.setAttribute('aria-label', `${game.name} box: ${specs.map(s=>`${s.cap} ${TYPE_LABEL[s.type]}s`).join(', ')}`);
  el.addEventListener('click', () => onBoxActivate(box));
  el.addEventListener('keydown', e => { if (e.key==='Enter' || e.key===' '){ e.preventDefault(); onBoxActivate(box); } });
  shelf.append(el);
  return box;
}

function makePiece(game, type){
  const el = document.createElement('button');
  el.type = 'button'; el.className = 'piece';
  el.innerHTML = pieceSVG(type, game.color, game.motif, randInt(1,6));
  el.setAttribute('aria-label', `${game.name} ${TYPE_LABEL[type]}`);
  const p = {el, game, type, fx:.5, fy:.5, r:0, placed:false};
  el.addEventListener('click', e => { if (e.detail === 0 && !p.placed) toggleSelect(p); });
  return p;
}

function sizePieces(){
  const r = table.getBoundingClientRect();
  const n = Math.max(8, state.pieces.filter(p=>!p.placed).length || state.total);
  const p = Math.max(30, Math.min(56, Math.sqrt(r.width*r.height/Math.max(n, 10))*.46));
  state.p = p; root.style.setProperty('--p', p.toFixed(1)+'px');
}

function scatter(){
  const r = table.getBoundingClientRect(), W = r.width, H = r.height, P = state.p;
  const m = P*.62 + 8, pts = [];
  const blocked = (x,y) => x > W - 110 && y < 105; // the mug
  state.pieces.forEach(p => {
    let best = null, bestD = -1;
    for (let t=0;t<60;t++){
      const x = rand(m, W-m), y = rand(m, H-m);
      if (blocked(x,y)) continue;
      let d = Infinity; for (const q of pts) d = Math.min(d, Math.hypot(q[0]-x, q[1]-y));
      if (d > bestD){ bestD = d; best = [x,y]; }
      if (d > P*1.05) break;
    }
    if (!best) best = [rand(m, W-m-110), rand(m, H-m)];
    pts.push(best);
    p.fx = best[0]/W; p.fy = best[1]/H; p.r = rand(-35, 35);
    setPos(p);
  });
}
function setPos(p){ p.el.style.left = (p.fx*100)+'%'; p.el.style.top = (p.fy*100)+'%'; p.el.style.setProperty('--r', p.r.toFixed(1)+'deg'); }

function updateProgress(){
  $('#plabel').innerHTML = `<b>${state.placed}</b> of ${state.total} pieces put away`;
  $('#pfill').style.width = (state.total ? state.placed/state.total*100 : 0) + '%';
}

/* ---------- Motion ---------- */
function firstOf(p, scale=1){
  const r = p.el.getBoundingClientRect();
  return {cx:r.left+r.width/2, cy:r.top+r.height/2, size:p.el.offsetWidth*scale, rot:p.r};
}
function flip(el, first, centered, endRot){
  if (REDUCE) return;
  const r = el.getBoundingClientRect();
  const dx = first.cx-(r.left+r.width/2), dy = first.cy-(r.top+r.height/2);
  const s = first.size / (el.offsetWidth || 1);
  const pre = centered ? 'translate(-50%,-50%) ' : '';
  el.animate([
    {transform:`translate(${dx}px,${dy}px) ${pre}rotate(${first.rot}deg) scale(${s})`},
    {transform:`translate(0px,0px) ${pre}rotate(${endRot}deg) scale(1)`}
  ], {duration: centered ? 300 : 420, easing:'cubic-bezier(.25,1.35,.45,1)'});
}
function burst(x, y, colors, n=12){
  if (REDUCE) return;
  for (let i=0;i<n;i++){
    const s = document.createElement('i');
    s.className = 'spark' + (i%3===0 ? ' star' : '');
    s.style.background = colors[i % colors.length];
    s.style.left = x+'px'; s.style.top = y+'px';
    document.body.append(s);
    const a = Math.random()*Math.PI*2, d = 22 + Math.random()*34;
    s.animate([
      {transform:'translate(-50%,-50%) scale(1)', opacity:1},
      {transform:`translate(calc(-50% + ${Math.cos(a)*d}px), calc(-50% + ${Math.sin(a)*d - 10}px)) scale(.2) rotate(${rand(-180,180)}deg)`, opacity:0}
    ], {duration:520+Math.random()*300, easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish = () => s.remove();
  }
}
function centerOf(el){ const r = el.getBoundingClientRect(); return [r.left+r.width/2, r.top+r.height/2]; }
function flash(el, cls, ms){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(()=>el.classList.remove(cls), ms); }

/* ---------- Placement ---------- */
function tryPlace(p, box, first){
  const slot = !box.done && p.game.id === box.game.id ? box.slots.find(s => s.type === p.type && s.filled < s.cap) : null;
  if (!slot){
    state.oops++; state.combo = 0; sfx.wrong(); flash(box.el, 'wrong', 400);
    return false;
  }
  seat(p, slot, box, first); return true;
}

function seat(p, slot, box, first){
  p.placed = true;
  if (state.sel === p) state.sel = null;
  const el = p.el;
  el.classList.remove('dragging','selected','hint','wobble');
  el.style.left = el.style.top = '';
  el.tabIndex = -1; el.setAttribute('aria-disabled','true');
  slot.el.append(el); slot.el.classList.add('has');
  flip(el, first, false, 0);
  slot.filled++; box.filled++; state.placed++; state.combo++;
  slot.tally.textContent = `${slot.filled}/${slot.cap}`;
  box.countEl.textContent = `${box.filled}/${box.total}`;
  updateProgress(); clearArmed();
  sfx.place(state.combo - 1);
  const [x,y] = centerOf(slot.el);
  burst(x, y, [p.game.color, '#ffe3a8', '#ffffff'], 8);
  if (slot.filled === slot.cap){ slot.el.classList.add('full'); setTimeout(sfx.full, 120); }
  if (box.filled === box.total) setTimeout(() => closeBox(box), 380);
}

function closeBox(box){
  box.done = true; box.el.classList.add('done');
  box.el.setAttribute('aria-label', `${box.game.name} box, put away`);
  setTimeout(() => {
    sfx.box();
    const [x,y] = centerOf(box.el);
    burst(x, y, [box.game.color, '#f3b648', '#ffe3a8', '#ffffff'], 22);
  }, 260);
  if (state.boxes.every(b => b.done)) setTimeout(levelDone, 1200);
}

function levelDone(){
  sfx.win();
  const cfg = levelCfg(state.level);
  const secs = Math.round((performance.now() - state.t0)/1000);
  $('#ov-eyebrow').textContent = `Night ${state.level} · ${cfg.name}`;
  $('#ov-title').textContent = state.oops === 0 ? 'Perfectly put away' : 'The table is clear';
  $('#st-pieces').textContent = state.total;
  $('#st-time').textContent = `${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}`;
  $('#st-oops').textContent = state.oops;
  const stack = $('#stack'); stack.innerHTML = '';
  state.boxes.forEach((b,i) => {
    const s = document.createElement('div');
    s.className = 'stackbox';
    s.style.setProperty('--c', b.game.color);
    s.style.width = `${rand(64, 92).toFixed(0)}%`;
    s.style.transform = `rotate(${rand(-2.5,2.5).toFixed(1)}deg)`;
    s.style.animationDelay = `${.15 + i*.14}s`;
    s.innerHTML = `${motifSVG(b.game.motif)}<span>${b.game.name}</span>`;
    stack.append(s);
  });
  state.level++; store.set('agn-level', state.level);
  $('#ov').hidden = false;
  $('#btn-next').focus();
}

/* ---------- Selection (tap / keyboard) ---------- */
function clearArmed(){ state.boxes.forEach(b => b.el.classList.remove('armed')); }
function toggleSelect(p){
  if (state.sel){ state.sel.el.classList.remove('selected'); }
  if (state.sel === p){ state.sel = null; clearArmed(); return; }
  state.sel = p; p.el.classList.add('selected'); sfx.pick();
  state.boxes.forEach(b => b.el.classList.toggle('armed', !b.done));
}
function onBoxActivate(box){
  const p = state.sel; if (!p || box.done) return;
  p.el.classList.remove('selected'); state.sel = null; clearArmed();
  if (!tryPlace(p, box, firstOf(p))) flash(p.el, 'wobble', 420);
}

/* ---------- Dragging ---------- */
const boxAt = (x,y) => { const el = document.elementFromPoint(x,y); const b = el && el.closest('.box'); return b ? state.boxes.find(o => o.el === b) : null; };
let hoverBox = null;
function setHover(b){ if (hoverBox === b) return; if (hoverBox) hoverBox.el.classList.remove('hover'); hoverBox = b && !b.done ? b : null; if (hoverBox) hoverBox.el.classList.add('hover'); }

table.addEventListener('pointerdown', e => {
  const el = e.target.closest('.piece');
  if (!el){ if (state.sel){ state.sel.el.classList.remove('selected'); state.sel = null; clearArmed(); } return; }
  const p = state.pieces[+el.dataset.idx];
  if (!p || p.placed || drag) return;
  e.preventDefault(); ac();
  drag = {p, id:e.pointerId, x0:e.clientX, y0:e.clientY, moving:false, ox:0, oy:0};
});
window.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.moving){
    if (Math.hypot(e.clientX-drag.x0, e.clientY-drag.y0) < 6) return;
    const p = drag.p, [cx,cy] = centerOf(p.el);
    if (state.sel){ state.sel.el.classList.remove('selected'); state.sel = null; clearArmed(); }
    drag.ox = cx - e.clientX; drag.oy = cy - e.clientY; drag.moving = true;
    p.el.classList.add('dragging'); document.body.append(p.el);
    sfx.pick();
  }
  drag.p.el.style.left = (e.clientX + drag.ox)+'px';
  drag.p.el.style.top  = (e.clientY + drag.oy)+'px';
  setHover(boxAt(e.clientX, e.clientY));
});
function endPointer(e){
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null; setHover(null);
  if (!d.moving){ if (e.type === 'pointerup') toggleSelect(d.p); return; }
  const p = d.p, first = firstOf(p, 1.15);
  const box = e.type === 'pointerup' ? boxAt(e.clientX, e.clientY) : null;
  if (box && tryPlace(p, box, first)) return;
  // back onto the table: where it was dropped if that's on the table, otherwise where it came from
  const tr = table.getBoundingClientRect(), x = e.clientX + d.ox, y = e.clientY + d.oy;
  if (!box && x > tr.left && x < tr.right && y > tr.top && y < tr.bottom){
    const m = state.p*.5 + 4;
    p.fx = Math.min(Math.max(x - tr.left, m), tr.width - m) / tr.width;
    p.fy = Math.min(Math.max(y - tr.top,  m), tr.height - m) / tr.height;
    p.r = p.r + rand(-12, 12);
    sfx.table();
  }
  p.el.classList.remove('dragging');
  table.append(p.el); setPos(p);
  flip(p.el, first, true, p.r);
}
window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', endPointer);

/* ---------- Tools ---------- */
function hint(){
  ac();
  const left = state.pieces.filter(p => !p.placed);
  if (!left.length) return;
  const p = state.sel || left[Math.floor(Math.random()*left.length)];
  const box = state.boxes.find(b => b.game.id === p.game.id);
  const slot = box.slots.find(s => s.type === p.type && s.filled < s.cap);
  flash(p.el, 'hint', 1900); if (slot) flash(slot.el, 'hint', 1900);
  tone(880,{dur:.18,vol:.07}); tone(1174.66,{dur:.25,vol:.07,delay:.1});
}
const soundBtn = $('#btn-sound');
function syncSound(){ soundBtn.setAttribute('aria-pressed', String(soundOn)); soundBtn.title = soundOn ? 'Sound on' : 'Sound off'; }
soundBtn.addEventListener('click', () => { soundOn = !soundOn; store.set('agn-sound', soundOn); syncSound(); if (soundOn) tone(784,{dur:.15,vol:.08}); });
$('#btn-hint').addEventListener('click', hint);
$('#btn-restart').addEventListener('click', () => { ac(); buildLevel(); });
$('#btn-next').addEventListener('click', () => { ac(); buildLevel(); });
$('#btn-again').addEventListener('click', () => { ac(); state.level = Math.max(1, state.level-1); buildLevel(); });
syncSound();

let rsT; new ResizeObserver(() => { clearTimeout(rsT); rsT = setTimeout(sizePieces, 60); }).observe(table);

function toast(msg, ms=3800){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), ms); }

/* ---------- Boot ---------- */
window.claude?.hot?.snapshot?.(() => ({level: state.level}));
function start(data){
  if (data && data.level) state.level = data.level;
  buildLevel();
  if (!store.get('agn-seen-tip', false)){
    setTimeout(() => toast('Drag each piece into its game’s box. Match the color and the shape.'), 500);
    store.set('agn-seen-tip', true);
  }
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
