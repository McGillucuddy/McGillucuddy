<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Death Row Derby</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui"></div>
  <div id="touch">
    <div class="tgroup left">
      <button data-t="left">◀</button>
      <button data-t="right">▶</button>
    </div>
    <div class="tgroup right">
      <button data-t="drift" class="sm">DRIFT</button>
      <button data-t="nitro" class="sm">NOS</button>
      <button data-t="brake">▼</button>
      <button data-t="gas" class="gas">▲</button>
    </div>
  </div>
  <script src="js/util.js"></script>
  <script src="js/track.js"></script>
  <script src="js/upgrades.js"></script>
  <script src="js/car.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/race.js"></script>
  <script src="js/campaign.js"></script>
  <script src="js/input.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
