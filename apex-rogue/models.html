<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apex Rogue Models</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="mv">
  <aside class="mv-side">
    <h1 class="logo small-logo">APEX<span>ROGUE</span></h1>
    <p class="muted small">Low-poly models. Drag to orbit, scroll to zoom.</p>
    <div id="list"></div>
    <p class="small"><a class="muted" href="index.html">← Game</a> · <a class="muted" href="prototype.html">Gunner prototype</a></p>
  </aside>
  <main class="mv-main">
    <canvas id="view"></canvas>
    <div class="mv-info panel">
      <h2 id="name"></h2>
      <p id="desc" class="muted"></p>
      <p id="tris" class="small muted"></p>
      <label class="small"><input type="checkbox" id="auto" checked> Auto-rotate</label>
      <label class="small"><input type="checkbox" id="wire"> Wireframe</label>
      <label class="small"><input type="checkbox" id="retro" checked> Retro look</label>
      <div>
        <button class="btn primary" id="dl">Download .glb</button>
        <button class="btn" id="dl-all">Download all</button>
      </div>
    </div>
  </main>
  <script src="vendor/three.min.js"></script>
  <script src="vendor/GLTFExporter.js"></script>
  <script src="js/util.js"></script>
  <script src="js/upgrades.js"></script>
  <script src="js/build.js"></script>
  <script src="js/psx.js"></script>
  <script src="js/sculpt.js"></script>
  <script src="js/models.js"></script>
  <script src="js/trinkets.js"></script>
  <script src="js/modelviewer.js"></script>
</body>
</html>
